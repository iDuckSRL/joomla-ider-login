PLG_SYSTEM_IDERLOGIN="System - IDer Login"
PLG_SYSTEM_IDERLOGIN_XML_DESCRIPTION="Lets users sign in and sign up with the IDer app: they scan a QR code, no password needed."
PLG_SYSTEM_IDERLOGIN_SETUP_LABEL="How to connect your site to IDer"
PLG_SYSTEM_IDERLOGIN_SETUP_DESC="In the IDer partner portal (<a href=\"https://partner.ider.com\" target=\"_blank\" rel=\"noopener\">partner.ider.com</a>) open Login Button → Edit, choose the framework <strong>Website</strong> and enter:<br>authentication request URL: <code>%1$s</code><br>callback URL: <code>%2$s</code><br>Then copy Client Id, Client Secret and Scope Name into the fields below."
PLG_SYSTEM_IDERLOGIN_CLIENT_ID_LABEL="Client Id"
PLG_SYSTEM_IDERLOGIN_CLIENT_ID_DESC="From the IDer partner portal, Login Button summary."
PLG_SYSTEM_IDERLOGIN_CLIENT_SECRET_LABEL="Client Secret"
PLG_SYSTEM_IDERLOGIN_CLIENT_SECRET_DESC="From the IDer partner portal. Keep it private."
PLG_SYSTEM_IDERLOGIN_SCOPE_LABEL="Scope Name"
PLG_SYSTEM_IDERLOGIN_SCOPE_DESC="The Scope Name of the Login Button (one value). A link to the login address with ?scope= can use another campaign of the same client instead."
PLG_SYSTEM_IDERLOGIN_ALLOW_REGISTRATION_LABEL="Create new users"
PLG_SYSTEM_IDERLOGIN_ALLOW_REGISTRATION_DESC="If disabled, only users who already have an account with the same email can sign in with IDer."
PLG_SYSTEM_IDERLOGIN_UPDATE_DATA_LABEL="Update user data at every login"
PLG_SYSTEM_IDERLOGIN_UPDATE_DATA_DESC="The name and, if the core plugin User - Profile is enabled, address, phone, date of birth and website are updated with the data the user shares through IDer."
PLG_SYSTEM_IDERLOGIN_ALLOW_BACKEND_LABEL="Allow administrator accounts"
PLG_SYSTEM_IDERLOGIN_ALLOW_BACKEND_DESC="If disabled (recommended), accounts that can access the administrator panel cannot sign in with IDer."
PLG_SYSTEM_IDERLOGIN_REDIRECT_LABEL="Page after login"
PLG_SYSTEM_IDERLOGIN_REDIRECT_DESC="Optional address of this site. Empty = the page the user came from, or the home page."
PLG_SYSTEM_IDERLOGIN_LANDING_LABEL="Landing pages by scope"
PLG_SYSTEM_IDERLOGIN_LANDING_DESC="Optional, one per line: scope=address. When a login uses that scope (e.g. from an IDer campaign), the user lands on that page."
PLG_SYSTEM_IDERLOGIN_BUTTON="Sign in with IDer"
PLG_SYSTEM_IDERLOGIN_BUTTON_DESC="Scan the QR code with the IDer app: no password needed."
PLG_SYSTEM_IDERLOGIN_ERR_NOT_CONFIGURED="Sign-in with IDer is not configured yet."
PLG_SYSTEM_IDERLOGIN_ERR_UNREACHABLE="IDer is not reachable right now. Please try again later."
PLG_SYSTEM_IDERLOGIN_ERR_EXPIRED="The sign-in request has expired. Please try again."
PLG_SYSTEM_IDERLOGIN_ERR_CANCELLED="Sign-in with IDer was cancelled."
PLG_SYSTEM_IDERLOGIN_ERR_FAILED="IDer could not complete the sign-in. Please try again."
PLG_SYSTEM_IDERLOGIN_ERR_NO_EMAIL="IDer did not send the data needed to sign in (email)."
PLG_SYSTEM_IDERLOGIN_ERR_NO_ACCOUNT="There is no account with your IDer email on this site."
PLG_SYSTEM_IDERLOGIN_ERR_BLOCKED="Your account is blocked or not activated. Please contact the site."
PLG_SYSTEM_IDERLOGIN_ERR_BACKEND_USER="For security, administrator accounts cannot sign in with IDer. Use your password."
