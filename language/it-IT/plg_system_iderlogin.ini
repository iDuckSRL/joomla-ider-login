PLG_SYSTEM_IDERLOGIN="Sistema - IDer Login"
PLG_SYSTEM_IDERLOGIN_XML_DESCRIPTION="Accesso e registrazione degli utenti con l'app IDer: inquadrano un QR code, senza password."
PLG_SYSTEM_IDERLOGIN_SETUP_LABEL="Come collegare il sito a IDer"
PLG_SYSTEM_IDERLOGIN_SETUP_DESC="Nel portale partner IDer (<a href=\"https://partner.ider.com\" target=\"_blank\" rel=\"noopener\">partner.ider.com</a>) apri Login Button → Edit, scegli il framework <strong>Website</strong> e inserisci:<br>indirizzo di avvio dell'accesso: <code>%1$s</code><br>callback: <code>%2$s</code><br>Poi copia Client Id, Client Secret e Scope Name nei campi qui sotto."
PLG_SYSTEM_IDERLOGIN_CLIENT_ID_LABEL="Client Id"
PLG_SYSTEM_IDERLOGIN_CLIENT_ID_DESC="Dal portale partner IDer, riepilogo del Login Button."
PLG_SYSTEM_IDERLOGIN_CLIENT_SECRET_LABEL="Client Secret"
PLG_SYSTEM_IDERLOGIN_CLIENT_SECRET_DESC="Dal portale partner IDer. Tienilo riservato."
PLG_SYSTEM_IDERLOGIN_SCOPE_LABEL="Scope Name"
PLG_SYSTEM_IDERLOGIN_SCOPE_DESC="Lo Scope Name del Login Button (un solo valore). Un link all'indirizzo di accesso con ?scope= può usare al suo posto un'altra campagna dello stesso client."
PLG_SYSTEM_IDERLOGIN_ALLOW_REGISTRATION_LABEL="Crea nuovi utenti"
PLG_SYSTEM_IDERLOGIN_ALLOW_REGISTRATION_DESC="Se disattivato, possono accedere con IDer solo gli utenti che hanno già un account con la stessa email."
PLG_SYSTEM_IDERLOGIN_UPDATE_DATA_LABEL="Aggiorna i dati a ogni accesso"
PLG_SYSTEM_IDERLOGIN_UPDATE_DATA_DESC="Il nome e, se è attivo il plugin di base Utente - Profilo, indirizzo, telefono, data di nascita e sito web vengono aggiornati con i dati che l'utente condivide tramite IDer."
PLG_SYSTEM_IDERLOGIN_ALLOW_BACKEND_LABEL="Permetti gli account amministratore"
PLG_SYSTEM_IDERLOGIN_ALLOW_BACKEND_DESC="Se disattivato (consigliato), gli account che possono entrare nel pannello di amministrazione non possono accedere con IDer."
PLG_SYSTEM_IDERLOGIN_REDIRECT_LABEL="Pagina dopo l'accesso"
PLG_SYSTEM_IDERLOGIN_REDIRECT_DESC="Facoltativa, indirizzo di questo sito. Vuoto = la pagina da cui arrivava l'utente, oppure la home."
PLG_SYSTEM_IDERLOGIN_LANDING_LABEL="Pagine di arrivo per scope"
PLG_SYSTEM_IDERLOGIN_LANDING_DESC="Facoltative, una per riga: scope=indirizzo. Quando un accesso usa quello scope (es. da una campagna IDer), l'utente arriva su quella pagina."
PLG_SYSTEM_IDERLOGIN_BUTTON="Accedi con IDer"
PLG_SYSTEM_IDERLOGIN_BUTTON_DESC="Inquadra il QR code con l'app IDer: niente password."
PLG_SYSTEM_IDERLOGIN_ERR_NOT_CONFIGURED="L'accesso con IDer non è ancora configurato."
PLG_SYSTEM_IDERLOGIN_ERR_UNREACHABLE="IDer non è raggiungibile in questo momento. Riprova più tardi."
PLG_SYSTEM_IDERLOGIN_ERR_EXPIRED="La richiesta di accesso è scaduta. Riprova."
PLG_SYSTEM_IDERLOGIN_ERR_CANCELLED="L'accesso con IDer è stato annullato."
PLG_SYSTEM_IDERLOGIN_ERR_FAILED="IDer non è riuscito a completare l'accesso. Riprova."
PLG_SYSTEM_IDERLOGIN_ERR_NO_EMAIL="IDer non ha inviato i dati necessari per l'accesso (email)."
PLG_SYSTEM_IDERLOGIN_ERR_NO_ACCOUNT="Su questo sito non c'è un account con la tua email IDer."
PLG_SYSTEM_IDERLOGIN_ERR_BLOCKED="Il tuo account è bloccato o non attivato. Contatta il sito."
PLG_SYSTEM_IDERLOGIN_ERR_BACKEND_USER="Per sicurezza gli account amministratore non possono accedere con IDer. Usa la password."
